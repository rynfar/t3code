<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MCP app host fixture</title>
    <style>
      :root {
        font-family: var(--font-sans, system-ui);
        color: var(--color-text-primary);
        background: var(--color-background-primary);
      }
      body {
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 16px;
      }
      p {
        font-size: 14px;
        color: var(--color-text-secondary);
      }
      button {
        font: inherit;
        color: inherit;
        background: var(--color-background-secondary);
        border: 1px solid var(--color-border-primary);
        border-radius: var(--border-radius-md);
        padding: 8px 12px;
        margin-right: 8px;
      }
      pre {
        white-space: pre-wrap;
        font-family: var(--font-mono);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Weather in Oslo</h1>
    <p id="status">Connecting to the host…</p>
    <button id="refresh">Refresh weather</button><button id="read">Read resource</button
    ><button id="link">Open weather site</button>
    <pre id="result"></pre>
    <script>
      let id = 1;
      const send = (method, params = {}) =>
        window.parent.postMessage({ jsonrpc: "2.0", id: id++, method, params }, "*");
      window.addEventListener("message", (e) => {
        if (e.source !== window.parent) return;
        const m = e.data;
        if (m?.jsonrpc !== "2.0") return;
        if (m.result?.hostContext) {
          const c = m.result.hostContext;
          for (const [k, v] of Object.entries(c.styles.variables))
            document.documentElement.style.setProperty(k, v);
          document.documentElement.style.colorScheme = c.theme;
          document.getElementById("status").textContent =
            "Host initialized · " + c.platform + " · " + c.theme;
          window.parent.postMessage(
            { jsonrpc: "2.0", method: "ui/notifications/initialized" },
            "*",
          );
          window.parent.postMessage(
            { jsonrpc: "2.0", method: "ui/notifications/size-changed", params: { height: 236 } },
            "*",
          );
          send("ping");
        }
        if (m.method === "ui/notifications/tool-result" || m.id > 1)
          document.getElementById("result").textContent = JSON.stringify(
            m.params ?? m.result ?? m.error,
            null,
            2,
          );
      });
      document.getElementById("refresh").onclick = () =>
        send("tools/call", { name: "get_weather", arguments: { city: "Oslo" } });
      document.getElementById("read").onclick = () =>
        send("resources/read", { uri: "ui://weather/dashboard" });
      document.getElementById("link").onclick = () =>
        send("ui/open-link", { url: "https://example.com/weather" });
      send("ui/initialize", {
        protocolVersion: "2026-01-26",
        appInfo: { name: "native-weather-fixture", version: "1" },
      });
    </script>
  </body>
</html>
