[package]
name = "t3-core"
description = "T3 Code wire types, Effect RPC framing, and the client-side reducers. Pure: no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
alacritty_terminal.workspace = true
markdown = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
thiserror.workspace = true
url.workspace = true
regex = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
tree-sitter = "0.26.13"
tree-sitter-powershell = "0.26.6"
ts-parser-perl = "2.0.3"
tree-sitter-xml = "0.7.0"
csscolorparser = "0.8"
jsonc-parser = { version = "0.29", features = ["serde"] }
icu_datetime = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_locale_core = "2.3"
icu_calendar = { version = "2.3", default-features = false }
icu_decimal = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"

[dev-dependencies]
tree-sitter-bash = "0.23.3"
tree-sitter-ruby = "0.23.1"
