[package]
name = "t3-core"
description = "T3 Code wire types, Effect RPC framing, and the client-side reducers. Pure: no I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
alacritty_terminal.workspace = true
markdown = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
url.workspace = true
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
tree-sitter = "0.26.13"
tree-sitter-powershell = "0.26.6"
tree-sitter-fish = "3.6.0"
ts-parser-perl = "2.0.3"
tree-sitter-applescript = { git = "https://github.com/waddie/tree-sitter-applescript", rev = "e47cf0c9ae03055aedcc086e62f41004a112e1a3" }
tree-sitter-xml = "0.7.0"
csscolorparser = "0.8"
jsonc-parser = { version = "0.29", features = ["serde"] }

[dev-dependencies]
tree-sitter-bash = "0.23.3"
tree-sitter-ruby = "0.23.1"
