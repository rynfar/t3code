[package]
name = "t3-native"
description = "Native GPUI client for T3 Code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "t3-native"
path = "src/main.rs"

[features]
# Offscreen screenshots through GPUI's test renderer (`src/snapshot.rs`); off in normal builds.
snapshot = ["gpui/test-support", "gpui_platform/test-support", "t3-client/test-support"]

[dependencies]
t3-core.workspace = true
t3-client.workspace = true
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
# Syntax highlighting for markdown code blocks: the languages agents most often print.
gpui-component = { workspace = true, features = [
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-sql",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
gpui-component-assets.workspace = true
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "2f73e5c2bc03d6768cb5fcc92442c4cf4b963b70" }
# Bounded decoding of file previews; the formats are a subset of what GPUI already builds.
image = { version = "0.25.1", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
iana-time-zone = "0.1"
sys-locale = "0.3"
# Pairing-link QR codes, drawn as quads; no image rendering.
qrcode = { version = "0.14", default-features = false }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true
# Native web views for agent HTML (`webview/`): WKWebView through wry, hosted in a clipping
# AppKit view beneath GPUI's overlay plane.
wry = { version = "0.54", default-features = false, features = ["protocol", "transparent"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSGeometry",
  "NSData",
  "NSDate",
  "NSDateFormatter",
  "NSDictionary",
  "NSValue",
  "NSObject",
  "NSLocale",
  "NSUserDefaults",
  "NSString",
  "NSTimeZone",
  "NSURL",
  "NSURLRequest",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "NSPasteboard",
  "NSAppearance",
  "NSApplication",
  "NSDockTile",
  "NSAccessibilityConstants",
  "NSEvent",
  "NSGraphics",
  "NSResponder",
  "NSSound",
  "NSView",
  "NSWindow",
] }
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKWebView",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
