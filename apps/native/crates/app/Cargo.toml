[package]
name = "t3-native"
description = "Native GPUI client for T3 Code."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "t3-native"
path = "src/main.rs"

[dependencies]
t3-core.workspace = true
t3-client.workspace = true
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
# Syntax highlighting for markdown code blocks: the languages agents most often print.
gpui-component = { workspace = true, features = [
  "tree-sitter-bash",
  "tree-sitter-css",
  "tree-sitter-diff",
  "tree-sitter-go",
  "tree-sitter-html",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-sql",
  "tree-sitter-toml",
  "tree-sitter-tsx",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
] }
gpui-component-assets.workspace = true
# Bounded decoding of file previews; the formats are a subset of what GPUI already builds.
image = { version = "0.25.1", default-features = false, features = [
  "bmp",
  "gif",
  "ico",
  "jpeg",
  "png",
  "tiff",
  "webp",
] }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
